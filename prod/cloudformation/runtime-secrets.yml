AWSTemplateFormatVersion: '2010-09-09'
Description: Generated runtime secrets and least-privilege EC2 access for MorrowPal production.

Parameters:
  ProductionEc2RoleName:
    Type: String
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description: Physical name of the IAM role attached to production instance 01.

Resources:
  MysqlCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: morrowpal/prod/mysql
      Description: Generated credentials for the MorrowPal production MySQL application user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"morrowpal"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: morrowpal

  MysqlRootCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: morrowpal/prod/mysql-root
      Description: Generated credentials for the MorrowPal production MySQL root user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"root"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: morrowpal

  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: morrowpal/prod/jwt
      Description: Generated JWT signing secret for the MorrowPal production backend.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: morrowpal

  PostmarkServerTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: morrowpal/prod/postmark
      Description: Postmark server API token for MorrowPal production verification email delivery.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: serverToken
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: prod
        - Key: Application
          Value: morrowpal

  RuntimeSecretsReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-read-runtime-secrets
      Roles:
        - !Ref ProductionEc2RoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadMorrowPalRuntimeSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref MysqlCredentialsSecret
              - !Ref MysqlRootCredentialsSecret
              - !Ref JwtSigningSecret
              - !Ref PostmarkServerTokenSecret

Outputs:
  JwtSigningSecretArn:
    Description: ARN used by asm-exec to resolve the JWT signing secret at runtime.
    Value: !Ref JwtSigningSecret

  MysqlCredentialsSecretArn:
    Description: ARN used by asm-exec to resolve MySQL application credentials at runtime.
    Value: !Ref MysqlCredentialsSecret

  MysqlRootCredentialsSecretArn:
    Description: ARN used by asm-exec to resolve MySQL root credentials at runtime.
    Value: !Ref MysqlRootCredentialsSecret

  PostmarkServerTokenSecretArn:
    Description: ARN used by asm-exec to resolve the Postmark server API token at runtime.
    Value: !Ref PostmarkServerTokenSecret
