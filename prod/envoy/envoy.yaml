node:
  id: morrowpal-prod-envoy
  cluster: morrowpal-prod

layered_runtime:
  layers:
    - name: deployment_defaults
      static_layer:
        routing:
          backend_api:
            backend_api_blue: 50
            backend_api_green: 50
    - name: deployment_admin
      admin_layer: {}

static_resources:
  listeners:
    - name: backend_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                stream_idle_timeout: 60s
                request_timeout: 30s
                route_config:
                  name: backend_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes: &backend_api_routes
                        - match:
                            prefix: "/"
                          route:
                            timeout: 30s
                            weighted_clusters:
                              runtime_key_prefix: routing.backend_api
                              clusters:
                                - name: backend_api_blue
                                  weight: 50
                                - name: backend_api_green
                                  weight: 50
                            retry_policy:
                              retry_on: connect-failure,refused-stream,reset
                              num_retries: 1
                              per_try_timeout: 15s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          duration_ms: "%DURATION%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_host: "%UPSTREAM_HOST%"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: public_https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols:
                  - h2
                  - http/1.1
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_3
                tls_certificate_sds_secret_configs:
                  - name: morrowpal_certificate
                    sds_config:
                      path_config_source:
                        path: /etc/envoy/tls-certificate-sds.yaml
                        watched_directory:
                          path: /etc/envoy
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                use_remote_address: true
                stream_idle_timeout: 60s
                request_timeout: 30s
                route_config:
                  name: public_https_routes
                  virtual_hosts:
                    - name: production_api
                      domains:
                        - api.morrowpal.com
                      routes: *backend_api_routes
                    - name: production_app
                      domains:
                        - app.morrowpal.com
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: app
                            timeout: 30s
                    - name: reserved_production_names
                      domains:
                        - morrowpal.com
                        - admin.morrowpal.com
                        - www.morrowpal.com
                        - back.morrowpal.com
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: "This hostname is not configured yet.\n"
                    - name: unknown_hostname
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 421
                            body:
                              inline_string: "Unknown hostname.\n"
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          authority: "%REQ(:AUTHORITY)%"
                          duration_ms: "%DURATION%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          upstream_host: "%UPSTREAM_HOST%"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: app
      type: STRICT_DNS
      connect_timeout: 2s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            host: app
            path: /ready
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: app
                      port_value: 8080

    - name: backend_api_blue
      type: STRICT_DNS
      connect_timeout: 2s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          http_health_check:
            host: backend-api-blue
            path: /ready
      load_assignment:
        cluster_name: backend_api_blue
        endpoints:
          - priority: 0
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-api-blue
                      port_value: 8080
          - priority: 1
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-api-green
                      port_value: 8080

    - name: backend_api_green
      type: STRICT_DNS
      connect_timeout: 2s
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          http_health_check:
            host: backend-api-green
            path: /ready
      load_assignment:
        cluster_name: backend_api_green
        endpoints:
          - priority: 0
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-api-green
                      port_value: 8080
          - priority: 1
            lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend-api-blue
                      port_value: 8080

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
