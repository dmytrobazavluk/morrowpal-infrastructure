name: morrowpal

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

x-backend-common: &backend-common
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  pids_limit: 256
  logging: *default-logging
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-api-environment: &api-environment
  AWS_REGION: ${MORROWPAL_AWS_REGION:?MORROWPAL_AWS_REGION is required}
  APP_SYSTEM_ALERTS_PROVIDER: ${MORROWPAL_SYSTEM_ALERTS_PROVIDER:?MORROWPAL_SYSTEM_ALERTS_PROVIDER is required}
  APP_SYSTEM_ALERTS_TOPIC_ARN: ${MORROWPAL_SYSTEM_ALERTS_TOPIC_ARN:?MORROWPAL_SYSTEM_ALERTS_TOPIC_ARN is required}
  APP_SYSTEM_ALERTS_PUBLISH_TIMEOUT_MILLIS: "3000"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: morrowpal
  DB_USER: morrowpal
  APP_API_DB_MAX_POOL_SIZE: "6"
  APP_API_DB_MIN_IDLE: "1"
  APP_AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
  APP_AUTH_REFRESH_TOKEN_TTL_DAYS: "365"
  APP_AUTH_STORE_REVIEW_EMAIL: ${MORROWPAL_STORE_REVIEW_EMAIL:?MORROWPAL_STORE_REVIEW_EMAIL is required}
  APP_API_CORS_ALLOWED_ORIGIN_PATTERNS: ${MORROWPAL_CORS_ALLOWED_ORIGIN_PATTERNS:?MORROWPAL_CORS_ALLOWED_ORIGIN_PATTERNS is required}
  APP_CLIENT_COMPATIBILITY_ANDROID_MINIMUM_BUILD: "1.0.2"
  APP_CLIENT_COMPATIBILITY_ANDROID_UPDATE_URL: "https://play.google.com/store/apps/details?id=com.morrowpal.app"
  APP_CLIENT_COMPATIBILITY_IOS_MINIMUM_BUILD: "1.0.2"
  APP_CLIENT_COMPATIBILITY_IOS_UPDATE_URL: "https://apps.apple.com/us/search?term=MorrowPal"
  APP_CLIENT_COMPATIBILITY_WEB_MINIMUM_BUILD: "1.0.2"
  APP_CLIENT_COMPATIBILITY_WEB_UPDATE_URL: "${MORROWPAL_APP_URL:?MORROWPAL_APP_URL is required}/"
  APP_EMAIL_PROVIDER: ${MORROWPAL_EMAIL_PROVIDER:?MORROWPAL_EMAIL_PROVIDER is required}
  APP_EMAIL_POSTMARK_OTP_FROM_ADDRESS: ${MORROWPAL_EMAIL_OTP_FROM_ADDRESS:?MORROWPAL_EMAIL_OTP_FROM_ADDRESS is required}
  APP_EMAIL_POSTMARK_MESSAGE_STREAM: ${MORROWPAL_POSTMARK_MESSAGE_STREAM:?MORROWPAL_POSTMARK_MESSAGE_STREAM is required}
  APP_EMAIL_VERIFICATION_CODE_TTL_SECONDS: "900"
  APP_EMAIL_OTP_SEND_COOLDOWN_SECONDS: "1"
  APP_EMAIL_OTP_SENDS_PER_HOUR: "5"
  APP_EMAIL_OTP_FAILED_ATTEMPTS_PER_HOUR: "10"
  APP_EMAIL_OTP_FAILED_ATTEMPTS_PER_REQUEST: "5"
  APP_EMAIL_POSTMARK_CONNECT_TIMEOUT_MILLIS: "5000"
  APP_EMAIL_POSTMARK_READ_TIMEOUT_MILLIS: "10000"
  APP_DISPATCH_DELAY_MINUTES: "240"
  APP_DISPATCH_GRANULARITY_MINUTES: "5"
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=15.0
    -XX:+ExitOnOutOfMemoryError

x-api-command: &api-command
  - |
    DB_PASSWORD="$$(cat /run/secrets/mysql_app_password)"
    APP_AUTH_JWT_SECRET="$$(cat /run/secrets/jwt_signing_secret)"
    APP_AUTH_STORE_REVIEW_VERIFICATION_CODE="$$(cat /run/secrets/store_review_verification_code)"
    APP_EMAIL_POSTMARK_SERVER_TOKEN="$$(cat /run/secrets/postmark_server_token)"
    : "$${DB_PASSWORD:?mysql_app_password is empty}"
    : "$${APP_AUTH_JWT_SECRET:?jwt_signing_secret is empty}"
    : "$${APP_AUTH_STORE_REVIEW_VERIFICATION_CODE:?store_review_verification_code is empty}"
    : "$${APP_EMAIL_POSTMARK_SERVER_TOKEN:?postmark_server_token is empty}"
    export DB_PASSWORD APP_AUTH_JWT_SECRET APP_AUTH_STORE_REVIEW_VERIFICATION_CODE APP_EMAIL_POSTMARK_SERVER_TOKEN
    exec java -jar /app/app.jar

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 256
    logging: *default-logging
    environment:
      MYSQL_DATABASE: morrowpal
      MYSQL_USER: morrowpal
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    volumes:
      - ${MORROWPAL_MYSQL_DATA_MOUNT:?MORROWPAL_MYSQL_DATA_MOUNT is required}/mysql:/var/lib/mysql
      - ${MORROWPAL_DEPLOYMENT_ROOT:?MORROWPAL_DEPLOYMENT_ROOT is required}/mysql-migration-ready.cnf:/etc/mysql/conf.d/migration-ready.cnf:ro
    secrets:
      - mysql_app_password
      - mysql_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  backend-api-blue:
    <<: *backend-common
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/backend-api:${API_BLUE_IMAGE_TAG:?API_BLUE_IMAGE_TAG is required}
    mem_limit: 288m
    environment: *api-environment
    entrypoint: ["/bin/sh", "-ec"]
    command: *api-command
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    stop_grace_period: 30s
    secrets:
      - mysql_app_password
      - jwt_signing_secret
      - postmark_server_token
      - store_review_verification_code

  backend-api-green:
    <<: *backend-common
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/backend-api:${API_GREEN_IMAGE_TAG:?API_GREEN_IMAGE_TAG is required}
    mem_limit: 288m
    environment: *api-environment
    entrypoint: ["/bin/sh", "-ec"]
    command: *api-command
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    stop_grace_period: 30s
    secrets:
      - mysql_app_password
      - jwt_signing_secret
      - postmark_server_token
      - store_review_verification_code

  app:
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    mem_limit: 64m
    pids_limit: 64
    logging: *default-logging
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ${MORROWPAL_DEPLOYMENT_ROOT:?MORROWPAL_DEPLOYMENT_ROOT is required}/app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  website:
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/website:${WEBSITE_IMAGE_TAG:?WEBSITE_IMAGE_TAG is required}
    restart: unless-stopped
    read_only: true
    user: "101:101"
    mem_limit: 64m
    pids_limit: 64
    logging: *default-logging
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ${MORROWPAL_DEPLOYMENT_ROOT:?MORROWPAL_DEPLOYMENT_ROOT is required}/website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  envoy:
    image: envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66
    restart: unless-stopped
    read_only: true
    user: "101:101"
    group_add:
      - "1901"
    mem_limit: 128m
    pids_limit: 128
    logging: *default-logging
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend-api-blue
      - backend-api-green
      - app
      - website
    volumes:
      - ${MORROWPAL_DEPLOYMENT_ROOT:?MORROWPAL_DEPLOYMENT_ROOT is required}/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${MORROWPAL_DEPLOYMENT_ROOT:?MORROWPAL_DEPLOYMENT_ROOT is required}/envoy/tls-certificate-sds.yaml:/etc/envoy/tls-certificate-sds.yaml:ro
      - /etc/letsencrypt/live/${MORROWPAL_TLS_CERTIFICATE_NAME:?MORROWPAL_TLS_CERTIFICATE_NAME is required}:/etc/letsencrypt/live/${MORROWPAL_TLS_CERTIFICATE_NAME:?MORROWPAL_TLS_CERTIFICATE_NAME is required}:ro
      - /etc/letsencrypt/archive/${MORROWPAL_TLS_CERTIFICATE_NAME:?MORROWPAL_TLS_CERTIFICATE_NAME is required}:/etc/letsencrypt/archive/${MORROWPAL_TLS_CERTIFICATE_NAME:?MORROWPAL_TLS_CERTIFICATE_NAME is required}:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9901:9901"
      - "0.0.0.0:443:8443"

  backend-job-dispatch:
    <<: *backend-common
    mem_limit: 256m
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/backend-job:${JOB_IMAGE_TAG:?JOB_IMAGE_TAG is required}
    environment:
      AWS_REGION: ${MORROWPAL_AWS_REGION:?MORROWPAL_AWS_REGION is required}
      APP_SYSTEM_ALERTS_PROVIDER: ${MORROWPAL_SYSTEM_ALERTS_PROVIDER:?MORROWPAL_SYSTEM_ALERTS_PROVIDER is required}
      APP_SYSTEM_ALERTS_TOPIC_ARN: ${MORROWPAL_SYSTEM_ALERTS_TOPIC_ARN:?MORROWPAL_SYSTEM_ALERTS_TOPIC_ARN is required}
      APP_SYSTEM_ALERTS_PUBLISH_TIMEOUT_MILLIS: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: morrowpal
      DB_USER: morrowpal
      APP_JOB_DB_MAX_POOL_SIZE: "4"
      APP_JOB_DB_MIN_IDLE: "1"
      APP_JOBS_DISPATCH_ENABLED: "true"
      APP_JOBS_DISPATCH_POLL_INTERVAL_MS: "30000"
      APP_JOBS_DISPATCH_BATCH_SIZE: "50"
      APP_JOBS_DISPATCH_LEASE_DURATION_MS: "600000"
      APP_JOBS_DISPATCH_EMAIL_BATCH_SIZE: "50"
      APP_JOBS_DISPATCH_EMAIL_MINIMUM_AGE_MS: "120000"
      APP_JOBS_DISPATCH_EMAIL_LEASE_DURATION_MS: "600000"
      APP_JOBS_DISPATCH_APP_NOTIFICATIONS_BATCH_SIZE: "100"
      APP_JOBS_DISPATCH_APP_NOTIFICATIONS_MINIMUM_AGE_MS: "120000"
      APP_JOBS_DISPATCH_APP_NOTIFICATIONS_LEASE_DURATION_MS: "600000"
      APP_JOBS_CLEANUP_ENABLED: "false"
      APP_APP_NOTIFICATIONS_PROVIDER: ${MORROWPAL_APP_NOTIFICATIONS_PROVIDER:?MORROWPAL_APP_NOTIFICATIONS_PROVIDER is required}
      APP_APP_NOTIFICATIONS_FIREBASE_PROJECT_ID: ${MORROWPAL_FIREBASE_PROJECT_ID:?MORROWPAL_FIREBASE_PROJECT_ID is required}
      APP_APP_NOTIFICATIONS_FIREBASE_CONNECT_TIMEOUT_MILLIS: "5000"
      APP_APP_NOTIFICATIONS_FIREBASE_READ_TIMEOUT_MILLIS: "10000"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
      APP_EMAIL_PROVIDER: ${MORROWPAL_EMAIL_PROVIDER:?MORROWPAL_EMAIL_PROVIDER is required}
      APP_EMAIL_POSTMARK_DISPATCH_FROM_ADDRESS: ${MORROWPAL_EMAIL_NOTIFICATION_FROM_ADDRESS:?MORROWPAL_EMAIL_NOTIFICATION_FROM_ADDRESS is required}
      APP_EMAIL_POSTMARK_MESSAGE_STREAM: ${MORROWPAL_POSTMARK_MESSAGE_STREAM:?MORROWPAL_POSTMARK_MESSAGE_STREAM is required}
      APP_EMAIL_DISPATCH_OPT_OUT_URL: ${MORROWPAL_EMAIL_DISPATCH_OPT_OUT_URL:?MORROWPAL_EMAIL_DISPATCH_OPT_OUT_URL is required}
      APP_EMAIL_POSTMARK_CONNECT_TIMEOUT_MILLIS: "5000"
      APP_EMAIL_POSTMARK_READ_TIMEOUT_MILLIS: "10000"
      APP_DISPATCH_DELAY_MINUTES: "240"
      APP_DISPATCH_GRANULARITY_MINUTES: "5"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=15.0
        -XX:+ExitOnOutOfMemoryError
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        DB_PASSWORD="$$(cat /run/secrets/mysql_app_password)"
        APP_AUTH_JWT_SECRET="$$(cat /run/secrets/jwt_signing_secret)"
        APP_EMAIL_POSTMARK_SERVER_TOKEN="$$(cat /run/secrets/postmark_server_token)"
        : "$${DB_PASSWORD:?mysql_app_password is empty}"
        : "$${APP_AUTH_JWT_SECRET:?jwt_signing_secret is empty}"
        : "$${APP_EMAIL_POSTMARK_SERVER_TOKEN:?postmark_server_token is empty}"
        export DB_PASSWORD APP_AUTH_JWT_SECRET APP_EMAIL_POSTMARK_SERVER_TOKEN
        exec java -jar /app/app.jar
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_app_password
      - jwt_signing_secret
      - postmark_server_token
      - firebase_service_account

  backend-job-cleanup:
    <<: *backend-common
    mem_limit: 256m
    image: ${MORROWPAL_ECR_REGISTRY:?MORROWPAL_ECR_REGISTRY is required}/${MORROWPAL_ECR_REPOSITORY_PREFIX:?MORROWPAL_ECR_REPOSITORY_PREFIX is required}/backend-job:${JOB_IMAGE_TAG:?JOB_IMAGE_TAG is required}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: morrowpal
      DB_USER: morrowpal
      APP_JOB_DB_MAX_POOL_SIZE: "2"
      APP_JOB_DB_MIN_IDLE: "1"
      APP_JOBS_DISPATCH_ENABLED: "false"
      APP_JOBS_CLEANUP_ENABLED: "true"
      APP_JOBS_CLEANUP_POLL_INTERVAL_MS: "300000"
      APP_JOBS_CLEANUP_ACCOUNT_DELETION_BATCH_SIZE: "100"
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=15.0
        -XX:+ExitOnOutOfMemoryError
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        DB_PASSWORD="$$(cat /run/secrets/mysql_app_password)"
        APP_AUTH_JWT_SECRET="$$(cat /run/secrets/jwt_signing_secret)"
        : "$${DB_PASSWORD:?mysql_app_password is empty}"
        : "$${APP_AUTH_JWT_SECRET:?jwt_signing_secret is empty}"
        export DB_PASSWORD APP_AUTH_JWT_SECRET
        exec java -jar /app/app.jar
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_app_password
      - jwt_signing_secret

secrets:
  mysql_app_password:
    file: /run/morrowpal/secrets/mysql-app-password
  mysql_root_password:
    file: /run/morrowpal/secrets/mysql-root-password
  jwt_signing_secret:
    file: /run/morrowpal/secrets/jwt-signing-secret
  postmark_server_token:
    file: /run/morrowpal/secrets/postmark-server-token
  firebase_service_account:
    file: /run/morrowpal/secrets/firebase-service-account.json
  store_review_verification_code:
    file: /run/morrowpal/secrets/store-review-verification-code
