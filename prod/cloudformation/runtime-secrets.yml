AWSTemplateFormatVersion: '2010-09-09'
Description: Generated runtime secrets and least-privilege EC2 access for MorrowPal.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Deployment environment used for secret names, descriptions, and tags.

  Ec2RoleName:
    Type: String
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
    Description: Physical name of the IAM role attached to the environment's EC2 instance.

Resources:
  MysqlCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/mysql
      Description: !Sub Generated credentials for the MorrowPal ${Environment} MySQL application user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"morrowpal"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  MysqlRootCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/mysql-root
      Description: !Sub Generated credentials for the MorrowPal ${Environment} MySQL root user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"root"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/jwt
      Description: !Sub Generated JWT signing secret for the MorrowPal ${Environment} backend.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  PostmarkServerTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/postmark
      Description: !Sub Postmark server API token for MorrowPal ${Environment} email delivery.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: serverToken
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  FirebaseServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/firebase-service-account
      Description: !Sub Firebase service account JSON for MorrowPal ${Environment} app notification delivery.
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  StoreReviewVerificationCodeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub morrowpal/${Environment}/store-review
      Description: !Sub Fixed verification code for the MorrowPal ${Environment} application-store review account.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: value
        PasswordLength: 6
        ExcludeCharacters: '01IO'
        ExcludeLowercase: true
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  RuntimeSecretsReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-read-runtime-secrets
      Roles:
        - !Ref Ec2RoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadMorrowPalRuntimeSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref MysqlCredentialsSecret
              - !Ref MysqlRootCredentialsSecret
              - !Ref JwtSigningSecret
              - !Ref PostmarkServerTokenSecret
              - !Ref FirebaseServiceAccountSecret
              - !Ref StoreReviewVerificationCodeSecret

Outputs:
  JwtSigningSecretArn:
    Description: ARN used by asm-exec to resolve the JWT signing secret at runtime.
    Value: !Ref JwtSigningSecret

  MysqlCredentialsSecretArn:
    Description: ARN used by asm-exec to resolve MySQL application credentials at runtime.
    Value: !Ref MysqlCredentialsSecret

  MysqlRootCredentialsSecretArn:
    Description: ARN used by asm-exec to resolve MySQL root credentials at runtime.
    Value: !Ref MysqlRootCredentialsSecret

  PostmarkServerTokenSecretArn:
    Description: ARN used by asm-exec to resolve the Postmark server API token at runtime.
    Value: !Ref PostmarkServerTokenSecret

  FirebaseServiceAccountSecretArn:
    Description: ARN used by asm-exec to resolve Firebase service account JSON at runtime.
    Value: !Ref FirebaseServiceAccountSecret

  StoreReviewVerificationCodeSecretArn:
    Description: ARN used by asm-exec to resolve the store-review verification code at runtime.
    Value: !Ref StoreReviewVerificationCodeSecret
