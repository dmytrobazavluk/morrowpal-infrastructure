AWSTemplateFormatVersion: '2010-09-09'
Description: Stable public IPv4 address for the MorrowPal EC2 instance.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Deployment environment used for resource tags.

  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: EC2 instance that receives the Elastic IP address.

Resources:
  ProductionElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-ip
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: morrowpal

  ProductionElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ProductionElasticIp.AllocationId
      InstanceId: !Ref InstanceId

Outputs:
  AllocationId:
    Description: Allocation ID of the Elastic IP address.
    Value: !GetAtt ProductionElasticIp.AllocationId

  PublicIp:
    Description: Stable public IPv4 address assigned to the EC2 instance.
    Value: !Ref ProductionElasticIp
