---
- name: Deploy MorrowPal containers
  hosts: morrowpal_hosts
  become: true
  gather_facts: false

  vars:
    morrowpal_frontend_directory: "{{ playbook_dir }}/../../../frontend"
    morrowpal_web_client_build: >-
      {{ lookup('ansible.builtin.file', morrowpal_frontend_directory ~
         '/config/firebase/' ~ morrowpal_environment ~ '/build.json') | from_json }}
    morrowpal_web_firebase_config: >-
      {{ lookup('ansible.builtin.file', morrowpal_frontend_directory ~
         '/config/firebase/' ~ morrowpal_environment ~ '/web.json') | from_json }}
    asm_exec_version: 6d1de54ace0ba876d8c1d099fe5d7d8a7e8d384c
    asm_exec_checksum: 05a9f8164b63b286bcf88bf4223c95b799e0ecaada45ddcd805567f57b20299f
    asm_exec_url: >-
      https://raw.githubusercontent.com/aws/agent-toolkit-for-aws/{{ asm_exec_version
      }}/plugins/aws-core/skills/aws-secrets-manager/references/asm-exec

  pre_tasks:
    - name: Bind public web configuration to the selected deployment environment
      ansible.builtin.assert:
        that:
          - morrowpal_environment in ['prod', 'staging']
          - morrowpal_web_client_build.environment == morrowpal_environment
          - morrowpal_web_client_build.apiBaseUrl == morrowpal_public_urls.api
          - morrowpal_web_client_build.firebaseProjectId == morrowpal_firebase_project_id
          - morrowpal_web_firebase_config.projectId == morrowpal_firebase_project_id
          - morrowpal_web_firebase_config.apiKey | length > 0
          - morrowpal_web_firebase_config.appId | length > 0
          - morrowpal_web_firebase_config.messagingSenderId | length > 0
        fail_msg: Public web client configuration does not match the selected environment.

    - name: Validate the requested backend image tag
      ansible.builtin.assert:
        that:
          - morrowpal_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: Pass an immutable tag with -e morrowpal_image_tag=build-N-GITSHA.
      when: morrowpal_image_tag is defined

    - name: Require the prepared deployment directory
      ansible.builtin.stat:
        path: "{{ morrowpal_deployment_root }}"
      register: morrowpal_root_stat

    - name: Validate the deployment directory
      ansible.builtin.assert:
        that:
          - morrowpal_root_stat.stat.isdir | default(false)
        fail_msg: Run prepare-host.yml before deploy.yml.

    - name: Inspect the blue API image tag
      ansible.builtin.stat:
        path: "{{ morrowpal_deployment_root }}/api-blue-image-tag"
      register: morrowpal_blue_tag_stat

    - name: Require an initial immutable backend image tag
      ansible.builtin.assert:
        that:
          - morrowpal_image_tag is defined
          - morrowpal_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: >-
          Pass an immutable backend tag with
          -e morrowpal_image_tag=build-N-GITSHA.
      when: not morrowpal_blue_tag_stat.stat.exists

    - name: Inspect the app image tag
      ansible.builtin.stat:
        path: "{{ morrowpal_deployment_root }}/app-image-tag"
      register: morrowpal_app_tag_stat

    - name: Require an initial immutable app image tag
      ansible.builtin.assert:
        that:
          - morrowpal_app_image_tag is defined
          - morrowpal_app_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: >-
          Pass an immutable app tag with
          -e morrowpal_app_image_tag=build-N-GITSHA.
      when: not morrowpal_app_tag_stat.stat.exists

    - name: Validate the requested app image tag
      ansible.builtin.assert:
        that:
          - morrowpal_app_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: >-
          morrowpal_app_image_tag must use the build-N-GITSHA format.
      when: morrowpal_app_image_tag is defined

    - name: Inspect the website image tag
      ansible.builtin.stat:
        path: "{{ morrowpal_deployment_root }}/website-image-tag"
      register: morrowpal_website_tag_stat

    - name: Require an initial immutable website image tag
      ansible.builtin.assert:
        that:
          - morrowpal_website_image_tag is defined
          - morrowpal_website_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: >-
          Pass an immutable website tag with
          -e morrowpal_website_image_tag=build-N-SOURCESHA.
      when: not morrowpal_website_tag_stat.stat.exists

    - name: Validate the requested website image tag
      ansible.builtin.assert:
        that:
          - morrowpal_website_image_tag is match('^build-[1-9][0-9]*-[0-9a-f]{7}$')
        fail_msg: >-
          morrowpal_website_image_tag must use the build-N-SOURCESHA format.
      when: morrowpal_website_image_tag is defined

    - name: Read the MySQL mount metadata
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output
          - FSTYPE
          - --target
          - "{{ morrowpal_mysql_data_mount }}"
      register: morrowpal_data_mount
      changed_when: false
      check_mode: false

    - name: Require the encrypted XFS data mount
      ansible.builtin.assert:
        that:
          - (morrowpal_data_mount.stdout | default('')) == 'xfs'
        fail_msg: Run prepare-storage.yml before deploy.yml.

    - name: Inspect the selected environment TLS certificate files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/etc/letsencrypt/live/{{ morrowpal_tls_certificate_name }}/fullchain.pem"
        - "/etc/letsencrypt/live/{{ morrowpal_tls_certificate_name }}/privkey.pem"
      register: morrowpal_tls_files

    - name: Require the prepared TLS certificate
      ansible.builtin.assert:
        that:
          - morrowpal_tls_files.results | map(attribute='stat.exists') | min
        fail_msg: Run prepare-tls.yml before deploy.yml.

    - name: Inspect the MorrowPal service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - morrowpal.service
      register: morrowpal_service_state
      changed_when: false
      failed_when: false
      check_mode: false

  tasks:
    - name: Install deployment runtime packages
      ansible.builtin.dnf:
        name:
          - awscli-2
          - curl-minimal
          - python3
        state: present

    - name: Install the checksum-verified asm-exec helper
      ansible.builtin.get_url:
        url: "{{ asm_exec_url }}"
        dest: /usr/local/bin/asm-exec
        owner: root
        group: root
        mode: "0755"
        checksum: "sha256:{{ asm_exec_checksum }}"

    - name: Create the MorrowPal libexec directory
      ansible.builtin.file:
        path: /usr/local/libexec/morrowpal
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create the MorrowPal configuration directory
      ansible.builtin.file:
        path: /etc/morrowpal
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install the selected environment configuration
      ansible.builtin.template:
        src: ../runtime/compose.env.j2
        dest: /etc/morrowpal/environment
        owner: root
        group: root
        mode: "0640"
      register: morrowpal_environment_config

    - name: Install the runtime configuration library
      ansible.builtin.copy:
        src: ../scripts/morrowpal-runtime-config.sh
        dest: /usr/local/libexec/morrowpal/runtime-config
        owner: root
        group: root
        mode: "0644"

    - name: Create the Envoy configuration directory
      ansible.builtin.file:
        path: "{{ morrowpal_deployment_root }}/envoy"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create the web configuration directories
      ansible.builtin.file:
        path: "{{ morrowpal_deployment_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - app
        - website

    - name: Install the runtime secret writer
      ansible.builtin.copy:
        src: ../scripts/write-runtime-secrets.sh
        dest: /usr/local/libexec/morrowpal/write-runtime-secrets
        owner: root
        group: root
        mode: "0755"

    - name: Install the MorrowPal service command
      ansible.builtin.copy:
        src: ../scripts/morrowpal-service.sh
        dest: /usr/local/sbin/morrowpal-service
        owner: root
        group: root
        mode: "0755"

    - name: Install the rolling release command
      ansible.builtin.copy:
        src: ../scripts/morrowpal-deploy-release.sh
        dest: /usr/local/sbin/morrowpal-deploy-release
        owner: root
        group: root
        mode: "0755"

    - name: Install the app release command
      ansible.builtin.copy:
        src: ../scripts/morrowpal-deploy-app.sh
        dest: /usr/local/sbin/morrowpal-deploy-app
        owner: root
        group: root
        mode: "0755"

    - name: Install the website release command
      ansible.builtin.copy:
        src: ../scripts/morrowpal-deploy-website.sh
        dest: /usr/local/sbin/morrowpal-deploy-website
        owner: root
        group: root
        mode: "0755"

    - name: Install the selected environment Envoy configuration
      ansible.builtin.template:
        src: ../runtime/envoy/envoy.yaml.j2
        dest: "{{ morrowpal_deployment_root }}/envoy/envoy.yaml"
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_envoy_config

    - name: Install the selected environment Envoy TLS certificate SDS configuration
      ansible.builtin.template:
        src: ../runtime/envoy/tls-certificate-sds.yaml.j2
        dest: "{{ morrowpal_deployment_root }}/envoy/tls-certificate-sds.yaml"
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_envoy_tls_sds_config

    - name: Install the selected environment app Nginx configuration
      ansible.builtin.template:
        src: ../runtime/app/nginx.conf.j2
        dest: "{{ morrowpal_deployment_root }}/app/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_app_nginx_config

    - name: Install the selected environment public web runtime configuration
      ansible.builtin.template:
        src: ../runtime/app/runtime-config.js.j2
        dest: "{{ morrowpal_deployment_root }}/app/runtime-config.js"
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_app_runtime_config

    - name: Install the selected environment website Nginx configuration
      ansible.builtin.template:
        src: ../runtime/website/nginx.conf.j2
        dest: "{{ morrowpal_deployment_root }}/website/nginx.conf"
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_website_nginx_config

    - name: Install the MorrowPal Compose file
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ morrowpal_deployment_root }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0640"
      register: morrowpal_compose_file

    - name: Initialize the blue-green image tags
      ansible.builtin.copy:
        content: "{{ morrowpal_image_tag }}\n"
        dest: "{{ morrowpal_deployment_root }}/{{ item }}"
        owner: root
        group: root
        mode: "0640"
      loop:
        - api-blue-image-tag
        - api-green-image-tag
        - job-image-tag
      when: not morrowpal_blue_tag_stat.stat.exists

    - name: Initialize the app image tag
      ansible.builtin.copy:
        content: "{{ morrowpal_app_image_tag }}\n"
        dest: "{{ morrowpal_deployment_root }}/app-image-tag"
        owner: root
        group: root
        mode: "0640"
      when: not morrowpal_app_tag_stat.stat.exists

    - name: Initialize the website image tag
      ansible.builtin.copy:
        content: "{{ morrowpal_website_image_tag }}\n"
        dest: "{{ morrowpal_deployment_root }}/website-image-tag"
        owner: root
        group: root
        mode: "0640"
      when: not morrowpal_website_tag_stat.stat.exists

    - name: Install the MorrowPal systemd unit
      ansible.builtin.copy:
        src: ../runtime/systemd/morrowpal.service
        dest: /etc/systemd/system/morrowpal.service
        owner: root
        group: root
        mode: "0644"
      register: morrowpal_systemd_unit

    - name: Reload systemd after unit changes
      ansible.builtin.systemd:
        daemon_reload: true
      when: morrowpal_systemd_unit is changed

    - name: Determine the container reconciliation scope
      ansible.builtin.set_fact:
        morrowpal_reconciliation_required: >-
          {{
            (not morrowpal_blue_tag_stat.stat.exists) or
            (not morrowpal_app_tag_stat.stat.exists) or
            (not morrowpal_website_tag_stat.stat.exists) or
            (morrowpal_compose_file is changed) or
            (morrowpal_environment_config is changed) or
            (morrowpal_envoy_config is changed) or
            (morrowpal_envoy_tls_sds_config is changed) or
            (morrowpal_app_nginx_config is changed) or
            (morrowpal_app_runtime_config is changed) or
            (morrowpal_website_nginx_config is changed)
          }}
        morrowpal_envoy_recreation_required: >-
          {{
            (morrowpal_envoy_config is changed) or
            (morrowpal_envoy_tls_sds_config is changed)
          }}
        morrowpal_app_recreation_required: >-
          {{ (morrowpal_app_nginx_config is changed) or
             (morrowpal_app_runtime_config is changed) }}
        morrowpal_website_recreation_required: >-
          {{ morrowpal_website_nginx_config is changed }}

    - name: Enable and start MorrowPal
      ansible.builtin.systemd:
        name: morrowpal.service
        enabled: true
        state: started
      no_log: true

    - name: Preview in-place container reconciliation
      ansible.builtin.debug:
        msg: >-
          Non-API services with changed Compose definitions are reconciled in
          place. API services are recreated one at a time through the rolling
          release path. Forced recreation: Envoy
          {{ morrowpal_envoy_recreation_required }}, app
          {{ morrowpal_app_recreation_required }}, website
          {{ morrowpal_website_recreation_required }}.
      changed_when: true
      when:
        - ansible_check_mode
        - morrowpal_service_state.rc == 0
        - morrowpal_reconciliation_required

    - name: Reconcile changed and new non-API containers in place
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/local/sbin/morrowpal-service', 'reconcile']
            + (['--recreate-envoy'] if morrowpal_envoy_recreation_required else [])
            + (['--recreate-app'] if morrowpal_app_recreation_required else [])
            + (['--recreate-website'] if morrowpal_website_recreation_required else [])
          }}
      when:
        - not ansible_check_mode
        - morrowpal_service_state.rc == 0
        - morrowpal_reconciliation_required
      no_log: true

    - name: Roll changed API configuration with a requested release
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/morrowpal-deploy-release
          - --force-recreate
          - "{{ morrowpal_image_tag }}"
      when:
        - morrowpal_blue_tag_stat.stat.exists
        - (morrowpal_compose_file is changed) or (morrowpal_environment_config is changed)
        - morrowpal_image_tag is defined

    - name: Roll changed API configuration with current releases
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/morrowpal-deploy-release
          - --force-recreate
      when:
        - morrowpal_blue_tag_stat.stat.exists
        - (morrowpal_compose_file is changed) or (morrowpal_environment_config is changed)
        - morrowpal_image_tag is not defined

    - name: Roll out the requested immutable release
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/morrowpal-deploy-release
          - "{{ morrowpal_image_tag }}"
      when:
        - morrowpal_blue_tag_stat.stat.exists
        - morrowpal_compose_file is not changed
        - morrowpal_environment_config is not changed
        - morrowpal_image_tag is defined

    - name: Roll out the requested immutable app release
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/morrowpal-deploy-app
          - "{{ morrowpal_app_image_tag }}"
      when:
        - morrowpal_app_tag_stat.stat.exists
        - morrowpal_app_image_tag is defined
      no_log: true

    - name: Roll out the requested immutable website release
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/morrowpal-deploy-website
          - "{{ morrowpal_website_image_tag }}"
      when:
        - morrowpal_website_tag_stat.stat.exists
        - morrowpal_website_image_tag is defined
      no_log: true

    - name: Verify the backend readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/ready
        status_code: 200
      register: morrowpal_readiness
      retries: 12
      delay: 5
      until: morrowpal_readiness.status == 200
      check_mode: false
      when: not ansible_check_mode or morrowpal_blue_tag_stat.stat.exists

    - name: Verify the app readiness endpoint
      ansible.builtin.uri:
        url: "{{ morrowpal_public_urls.app }}/ready"
        status_code: 200
        return_content: true
      register: morrowpal_app_readiness
      retries: 12
      delay: 5
      until:
        - morrowpal_app_readiness.status == 200
        - morrowpal_app_readiness.content == 'ok\n'
      check_mode: false
      when: not ansible_check_mode or morrowpal_app_tag_stat.stat.exists

    - name: Verify the website readiness endpoint
      ansible.builtin.uri:
        url: "{{ morrowpal_public_urls.website }}/ready"
        status_code: 200
        return_content: true
      register: morrowpal_website_readiness
      retries: 12
      delay: 5
      until:
        - morrowpal_website_readiness.status == 200
        - morrowpal_website_readiness.content == 'ok\n'
      check_mode: false
      when: not ansible_check_mode or morrowpal_website_tag_stat.stat.exists

    - name: Verify the website canonical redirect
      ansible.builtin.uri:
        url: "{{ morrowpal_public_urls.website_www }}/"
        follow_redirects: none
        status_code: 301
        return_content: false
      register: morrowpal_website_redirect
      retries: 12
      delay: 5
      until:
        - morrowpal_website_redirect.status == 301
        - morrowpal_website_redirect.location == (morrowpal_public_urls.website + '/')
      check_mode: false
      when: not ansible_check_mode or morrowpal_website_tag_stat.stat.exists

    - name: Verify the website landing page
      ansible.builtin.uri:
        url: "{{ morrowpal_public_urls.website }}/"
        status_code: 200
        return_content: false
      register: morrowpal_website_landing_page
      retries: 12
      delay: 5
      until: morrowpal_website_landing_page.status == 200
      check_mode: false
      when: not ansible_check_mode or morrowpal_website_tag_stat.stat.exists

    - name: Verify the website child safety page
      ansible.builtin.uri:
        url: "{{ morrowpal_public_urls.website }}/child-safety/"
        status_code: 200
        return_content: false
      register: morrowpal_website_child_safety_page
      retries: 12
      delay: 5
      until: morrowpal_website_child_safety_page.status == 200
      check_mode: false
      when: not ansible_check_mode or morrowpal_website_tag_stat.stat.exists
