AWSTemplateFormatVersion: '2010-09-09'
Description: IAM instance profile for MorrowPal production EC2 container access.

Resources:
  ProductionEc2Role:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows a MorrowPal production EC2 host to pull approved ECR images.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcrPullApprovedRepositories
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrImagePull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/morrowpal/prod/app
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/morrowpal/prod/website
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/morrowpal/prod/backend-api
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/morrowpal/prod/backend-job

  ProductionEc2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ProductionEc2Role

Outputs:
  InstanceProfileArn:
    Description: ARN of the instance profile for MorrowPal production EC2 hosts.
    Value: !GetAtt ProductionEc2InstanceProfile.Arn

  InstanceProfileName:
    Description: Name used to associate the instance profile with an existing EC2 instance.
    Value: !Ref ProductionEc2InstanceProfile

  RoleArn:
    Description: ARN of the least-privilege production EC2 role.
    Value: !GetAtt ProductionEc2Role.Arn
